<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RCM</title>

  <!-- اللوجو اللي هيظهر في تب المتصفح -->
  <link rel="icon" type="image/png" href="/assets/rcm/logo.png">

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

  <style>
    html,body{height:100%;margin:0}
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      background:#000;
      font-family: Arial, sans-serif;
    }

.screen{
  position:relative;
  width:100%;
  height:100vh;

  background:
    radial-gradient(circle at 1px 1px, #3d3d3d 1px, transparent 0),
    #5398d7;

  background-size: 10px 10px;
  overflow:hidden;
}

.brand{
  position:absolute;
  top:18px;
  left:18px;
  display:flex;
  align-items:center;
  gap:10px;
  color:#d7e7ff;
  font-weight:700;
  font-size:18px;
  opacity:.95;
}

.brand img{
  width:60px;
  height:60px;
  object-fit:contain;
  transition: transform .4s ease;
}

.brand img:hover{
  animation: spin 1s linear infinite;
}

@keyframes spin{
  from{
    transform: rotate(0deg);
  }
  to{
    transform: rotate(360deg);
  }
}

.rcm{
  position:absolute;
  left:50%;
  top:42%;
  transform:translate(-50%,-50%);
  font-family: 'Orbitron', sans-serif;
  font-weight:900;
  letter-spacing:10px;
  font-size:150px;
  text-transform:uppercase;
  pointer-events:none;

  background: linear-gradient(90deg, #ffffff, #49e3ff, #ffffff);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;

  text-shadow:
    0 0 20px rgba(0,255,255,.6),
    0 0 40px rgba(0,255,255,.5),
    0 0 80px rgba(0,255,255,.4);

  animation: pulse 2s ease-in-out infinite;
}

.login{
  position:absolute;
  left:50%;
  bottom:10%;
  transform:translateX(-50%);
  padding:18px 50px;
  border-radius:40px;
  border:2px solid #49e3ff;
  cursor:pointer;

  font-size:18px;
  font-weight:900;
  letter-spacing:2px;

  background:transparent;
  color:#49e3ff;
  z-index: 50;

  transition: .2s;
}

.login:hover{
  background:#49e3ff;
  color:#000;
  box-shadow:0 0 25px rgba(73,227,255,.6);
}

.login:active{
  transform:translateX(-50%) scale(0.95);
}

  </style>
</head>

<body>

  <div class="screen">

    <div class="brand">
      <img src="/assets/rcm/logo.png" alt="Logo">
      <div>Powered by RAFIK</div>
    </div>

    <div class="rcm">RCM</div>

    <button class="login" onclick="location.href='/login.php'">LOGIN</button>

  </div>

</body>
</html>
